<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Update</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <h1>Configuration Update Successful</h1>
    <h2>The following lines were uncommented in your printer.cfg:</h2>
    <ul>
        {% for modification in modifications %}
            <li>{{ modification }}</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('index') }}">Return to Configuration Page</a>
</body>
</html>
